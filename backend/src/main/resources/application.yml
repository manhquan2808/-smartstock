# ======================================================================
# SmartStock - Cấu hình chung (áp dụng cho mọi môi trường).
# Giá trị bí mật luôn lấy từ biến môi trường, có giá trị mặc định cho dev.
# Cú pháp ${TEN_BIEN:gia-tri-mac-dinh}
# ======================================================================
spring:
  application:
    name: smartstock

  # ---------------- Kết nối cơ sở dữ liệu ----------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartstock?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:smartstock}
    password: ${SPRING_DATASOURCE_PASSWORD:smartstock123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Pool nhỏ vừa đủ cho ~20 người dùng đồng thời, tiết kiệm RAM
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 20000
      pool-name: smartstock-pool

  # ---------------- JPA / Hibernate ----------------
  jpa:
    # validate: Hibernate chỉ kiểm tra entity có khớp schema, KHÔNG tự sửa bảng.
    # Việc tạo/sửa bảng do Flyway đảm nhiệm (xem db/migration).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Bật cảnh báo khi một truy vấn sinh ra nhiều truy vấn con (N+1)
        query:
          in_clause_parameter_padding: true

  # ---------------- Flyway (quản lý phiên bản schema) ----------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ---------------- Email ----------------
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        mime:
          charset: UTF-8

  # ---------------- Tải file ----------------
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 4MB

  # ---------------- Thymeleaf (chỉ dùng cho template email) ----------------
  thymeleaf:
    cache: false
    check-template-location: false

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: false

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  # Nén phản hồi cho danh sách lớn
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript
  tomcat:
    threads:
      max: 50
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ======================================================================
# Cấu hình riêng của ứng dụng (đọc vào lớp AppProperties)
# ======================================================================
app:
  name: SmartStock
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    # Khóa HS256, tối thiểu 32 ký tự. Bắt buộc đổi khi triển khai thật.
    secret: ${JWT_SECRET:doi-khoa-nay-thanh-chuoi-bi-mat-rieng-cua-ban-toi-thieu-32-ky-tu}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  cookie:
    refresh-token-name: refresh_token
    # none khi frontend/backend khác domain (khi đó secure phải là true)
    same-site: ${APP_COOKIE_SAME_SITE:lax}
    secure: ${APP_COOKIE_SECURE:false}
  mail:
    from: ${MAIL_FROM:no-reply@smartstock.local}
    enabled: ${APP_MAIL_ENABLED:true}
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:uploads}
    cloudinary-url: ${CLOUDINARY_URL:}
    max-file-size-bytes: 2097152
  security:
    password-reset-token-minutes: 30
    max-failed-login-attempts: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # Tắt kiểm tra SMTP trong health check: máy chủ mail có thể tạm ngừng mà hệ thống
    # vẫn phục vụ bình thường (gửi mail là tác vụ nền, lỗi mail không chặn nghiệp vụ).
    # Nếu để bật, dịch vụ hosting sẽ hiểu nhầm là ứng dụng chết và khởi động lại liên tục.
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.smartstock: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
