<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <title>Phiếu chờ duyệt</title>
</head>
<body style="margin:0;padding:24px;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#262626;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;">
    <tr>
        <td style="background:#1677ff;padding:20px 24px;color:#ffffff;font-size:18px;font-weight:bold;">
            <span th:text="${appName}">SmartStock</span> &middot; Phiếu chờ duyệt
        </td>
    </tr>
    <tr>
        <td style="padding:24px;">
            <p style="margin:0 0 12px;">Xin chào <strong th:text="${fullName}">quản lý</strong>,</p>
            <p style="margin:0 0 16px;line-height:1.6;">
                Có một <span th:text="${documentType}">phiếu nhập</span> đang chờ bạn duyệt:
            </p>
            <table cellpadding="8" cellspacing="0" style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:20px;">
                <tr style="background:#fafafa;">
                    <td style="border:1px solid #f0f0f0;width:40%;">Mã phiếu</td>
                    <td style="border:1px solid #f0f0f0;font-weight:bold;" th:text="${documentCode}">PN-20261031-001</td>
                </tr>
                <tr>
                    <td style="border:1px solid #f0f0f0;">Kho</td>
                    <td style="border:1px solid #f0f0f0;" th:text="${warehouseName}">Kho Hà Nội</td>
                </tr>
            </table>
            <p style="margin:0 0 20px;text-align:center;">
                <a th:href="${link}" href="#"
                   style="display:inline-block;background:#1677ff;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:6px;font-weight:bold;">
                    Xem và duyệt phiếu
                </a>
            </p>
        </td>
    </tr>
    <tr>
        <td style="padding:16px 24px;background:#fafafa;font-size:12px;color:#8c8c8c;">
            Email tự động từ hệ thống <span th:text="${appName}">SmartStock</span>.
        </td>
    </tr>
</table>
</body>
</html>
