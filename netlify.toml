# ======================================================================
# Cấu hình triển khai frontend lên Netlify (gói miễn phí).
#
# File này BẮT BUỘC nằm ở thư mục gốc của repository.
# Netlify chỉ tìm netlify.toml trong "base directory", mà base directory mặc
# định là gốc repo. Nếu để file trong frontend/ thì Netlify không đọc được,
# sẽ publish thẳng thư mục gốc (không có index.html) và mọi đường dẫn trả về
# trang "Page not found".
#
# Các bước làm trên Netlify:
#   1. Add new site -> Import an existing project -> chọn repository này.
#   2. Không cần điền gì ở phần build, Netlify đọc file này.
#   3. Site configuration -> Environment variables: thêm
#      VITE_API_BASE_URL = https://<ten-dich-vu>.onrender.com
#      (Vite nhúng biến này vào mã lúc BUILD, nên phải thêm TRƯỚC khi deploy;
#       thêm sau thì bắt buộc bấm "Clear cache and deploy site".)
#   4. Deploy. Mỗi lần push lên nhánh chính, Netlify tự build lại.
# ======================================================================

[build]
  # Thư mục chứa mã frontend, tính từ gốc repo.
  base = "frontend"
  command = "npm run build"
  # publish tính TƯƠNG ĐỐI so với base, nên "dist" nghĩa là frontend/dist.
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Chuyển hướng cho ứng dụng một trang (SPA).
#
# Bắt buộc phải có: React Router xử lý đường dẫn ở phía trình duyệt, nên khi người
# dùng mở trực tiếp https://site/receipts/12 hoặc bấm F5, Netlify sẽ tìm file
# /receipts/12 và trả 404. Luật dưới đây yêu cầu Netlify trả index.html cho mọi
# đường dẫn, để React Router tự định tuyến.
#
# Luật này chỉ có tác dụng khi deploy bằng Git. Khi kéo-thả thủ công thư mục
# dist, Netlify không đọc netlify.toml, nên còn một bản sao ở frontend/public/_redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Các header bảo mật cơ bản
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# File tài nguyên có mã băm trong tên: lưu đệm dài hạn
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
