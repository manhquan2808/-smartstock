# ======================================================================
# Cấu hình Nginx phục vụ ứng dụng React (chỉ dùng trong profile `full`).
# ======================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nén nội dung để tải nhanh hơn trên đường truyền chậm
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Các header bảo mật cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File có tên chứa mã băm (do Vite sinh) không bao giờ đổi nội dung
    # -> cho trình duyệt lưu đệm một năm
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Chuyển tiếp API sang backend trong cùng mạng Docker
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kênh thông báo realtime (SSE) cần tắt đệm, nếu không thông báo bị giữ lại
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Ảnh sản phẩm / ảnh đại diện lưu ở backend
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    # SPA: mọi đường dẫn không phải file tĩnh đều trả index.html
    # để React Router tự xử lý điều hướng phía trình duyệt
    location / {
        try_files $uri $uri/ /index.html;
    }
}
